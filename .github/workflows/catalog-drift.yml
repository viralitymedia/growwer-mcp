name: Catalog drift

# The committed catalog.json is what an uncredentialed `npx @growwer/mcp` advertises, but the
# catalogue it mirrors lives in the backend repository — so nothing in a pull request here can
# notice it going stale. This job asks the hosted server directly, on a schedule, and fails loudly
# when the two disagree.
#
# Not part of CI: it depends on a live endpoint in another repository, and neither an outage there
# nor a deploy still to come should block a pull request here. The release does gate on the same
# check, through the `catalog` job in release.yml: npm, the image and the registry all need it, so
# a tag before the deploy publishes nothing. This weekly job stays red until that deploy.
on:
  schedule:
    # Mondays, 07:11 UTC. Off the hour to avoid the scheduler's own peak.
    - cron: '11 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Committed catalogue matches the hosted server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
          cache: npm
      - run: npm ci
      - run: npm run check:catalog
